[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pioneer-ml"
version = "0.1.0"
description = "Commercial-grade foundation for advanced LLM and ML applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Pioneer ML Team" }]
keywords = ["llm", "machine-learning", "mlops", "rag", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<26",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "tenacity>=8.3,<10",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40,<2",
    "tiktoken>=0.7,<1",
]
training = [
    "torch>=2.3,<3",
    "transformers>=4.44,<5",
    "datasets>=2.20,<4",
    "accelerate>=0.33,<2",
    "peft>=0.12,<1",
    "trl>=0.9,<1",
]
rag = [
    "chromadb>=0.5,<2",
    "sentence-transformers>=3.0,<6",
]
serve = [
    "fastapi>=0.112,<1",
    "uvicorn[standard]>=0.30,<1",
]
observability = [
    "opentelemetry-api>=1.26,<2",
    "opentelemetry-sdk>=1.26,<2",
    "prometheus-client>=0.20,<1",
]
huggingface = [
    "datasets>=2.20,<4",
    "scikit-learn>=1.5,<2",
    "huggingface-hub>=0.24",
]
huggingface-models = [
    "pioneer-ml[huggingface]",
    "transformers>=4.44,<6",
    "torch>=2.3,<3",
]
dev = [
    "pioneer-ml[llm,rag,serve,observability,huggingface]",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "types-pyyaml>=6.0,<7",
    "types-requests>=2.32,<3",
    "pip-licenses>=4.4,<6",
    "pipdeptree>=2.16,<3",
]
all = [
    "pioneer-ml[llm,training,rag,serve,observability,huggingface,dev]",
]

[project.scripts]
pioneer-train = "pioneer.cli.train:main"
pioneer-serve = "pioneer.cli.serve:main"
pioneer-eval = "pioneer.cli.eval:main"
pioneer-advise = "pioneer.cli.advise:main"
pioneer-scenarios = "pioneer.cli.scenarios:main"
pioneer-benchmark = "pioneer.cli.benchmark:main"
pioneer-hf-benchmark = "pioneer.cli.hf_benchmark:main"
pioneer-ingest = "pioneer.cli.ingest:main"

[project.urls]
Documentation = "https://github.com/pioneer-ml/pioneer-ml#readme"
Repository = "https://github.com/pioneer-ml/pioneer-ml"
Issues = "https://github.com/pioneer-ml/pioneer-ml/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pioneer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=pioneer --cov-report=term-missing"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["pioneer"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC",
    "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PTH",
    "ERA", "PL", "RUF",
]
ignore = ["PLR0913", "PLR2004", "TC001", "TC003", "PLW0108", "UP042", "B024"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "ARG002", "TC003"]
"src/pioneer/cli/serve.py" = ["PLC0415"]
"src/pioneer/observability/telemetry.py" = ["PLC0415"]
"src/pioneer/inference/engine.py" = ["PLC0415"]
"src/pioneer/intelligence/benchmark/competitors.py" = ["PLC0415", "ARG002"]
"src/pioneer/intelligence/benchmark/huggingface.py" = ["PLC0415"]
"src/pioneer/intelligence/ingestion/public_data.py" = ["PLC0415"]
"src/pioneer/intelligence/ingestion/scheduler.py" = ["PLC0415"]
"src/pioneer/intelligence/ingestion/feeds.py" = ["ICN001", "DTZ007"]
"src/pioneer/intelligence/risk/composite.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["pioneer"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
packages = ["pioneer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "peft.*",
    "sentence_transformers.*",
    "trl.*",
    "pandas.*",
    "datasets.*",
    "sklearn.*",
    "transformers.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true
